<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/signin.css}">
</head>
<body>
<span th:text="${error}"></span>
    <form action="#" th:action="@{/registration}" th:object="${user}" class="form-signin" method="post">
        <h1 class="h3 mb-3 font-weight-normal text-center">Registration</h1>
        <label for="username" class="sr-only">Login</label>
        <input type="text" id="username" class="form-control" th:field="*{username}" placeholder="Login" required>
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Incorrect username</p>
        <label for="password" class="sr-only">Password</label>
        <input type="password" id="password" class="form-control" th:field="*{password}" placeholder="Password" required>
        <label for="confirmedPassword" class="sr-only">Confirm your password:</label>
        <input type="password" id="confirmedPassword" class="form-control" name="confirmedPassword" placeholder="Confirmed password" required>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Submit</button>
    </form>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>
</html>
