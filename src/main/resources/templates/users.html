<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.10.0/css/bootstrap-select.min.css" rel="stylesheet" />
    <title>Hello</title>
</head>
<body>

<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">ЧаТиК</h5>

    <nav class="my-2 my-md-0 mr-md-3">
        <a class="p-2 text-dark" th:href="@{'/chat'}">На главную</a>
        <a class="p-2 text-dark" th:href="@{'/users'}">Все пользователи</a>
        <a class="p-2 text-dark" th:href="@{'/users/get/'+ ${currentUser.id}}" th:text="${currentUser.username}"></a>
    </nav>

    <a class="btn btn-outline-primary" href="#">Выйти</a>
</div>

<div class="table-responsive">
    <table class="table table-striped table-sm" >
        <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Block</th>
            <th>Option</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.role.name}"></td>
            <td th:text="${user.block}"></td>
            <td>
                <a th:if="${user.role.name.toString() == 'USER'}" class="btn btn-outline-primary" th:href="@{'/users/make-moderator/' + ${user.id}}">Сделать модератором</a>
                <a th:if="${user.role.name.toString() == 'MODERATOR'}" class="btn btn-outline-primary" th:href="@{'/users/make-user/' + ${user.id}}">Убрать из модераторов</a>
                <div class="bd-example">
                    <button type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#exampleModal">Переименовать</button>
                    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h4 class="modal-title" id="exampleModalLabel">Переименовать</h4>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>

                                <div class="modal-body">
                                    <form >
                                        <div class="form-group">
                                            <label class="form-control-label" th:text="'Старый логин: ' + ${user.username}"></label>
                                        </div>
                                        <div class="form-group">
                                            <label for="message-text" class="form-control-label">Новый логин:</label>
                                            <textarea class="form-control" id="message-text"></textarea>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрыть</button>
                                            <button type="submit" class="btn btn-primary" th:href="@{'/users/update-role/' + ${user.id}}">Готово!</button>
                                        </div>
                                    </form>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <a th:if="${user.isBlock()}" class="btn btn-outline-primary" th:href="@{'/users/unblock/' + ${user.id}}">Разблокировать</a>
                <a th:unless="${user.isBlock()}" class="btn btn-outline-primary" th:href="@{'/users/block/' + ${user.id}}">Заблокировать</a>

                <p><a class="btn btn-outline-primary" th:href="@{'/users/delete/' + ${user.id}}">Удалить</a></p>
            </td>
        </tr>

        </tbody>
    </table>
</div>
<script>
    var exampleModal = document.getElementById('exampleModal')
    exampleModal.addEventListener('submit', function (event) {
        var modalTitle = exampleModal.querySelector('#message-text')
        console.log(modalTitle)
    })
</script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.10.0/js/bootstrap-select.min.js"></script>
</body>
</html>
