<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:security="http://www.springframework.org/security/tags">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <title>Hello</title>
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a class="p-2 text-dark" th:href="@{'/chat'}">ЧаТиК</a>
    </h5>
    <nav class="my-2 my-md-0 mr-md-3">
        <a class="p-2 text-dark" th:href="@{'/users'}">Все пользователи</a>
        <a id="name" class="p-2 text-dark" href="#" th:text="${currentUser.username}"></a>
    </nav>
    <security:authorize access="isAuthenticated()">
        <a class="btn btn-outline-primary" href="/logout">Выйти</a>
    </security:authorize>
</div>

<div class="table-responsive">
    <div>
        <h2 th:text="${chat.name}"></h2>
        <a th:if="${access}" class="btn btn-outline-primary" th:href="@{'/chat/rename/' + ${chat.id}}">Переименовать чат</a>
        <a th:if="${access}" class="btn btn-outline-primary" th:href="@{'/chat/delete/' + ${chat.id}}">Удалить чат</a>
    </div>
    <div>
        <form th:action="@{'/chat/' + ${chat.id} + '/add-user/'} " method="post" th:object="${user}" class="row">
            <label th:if="!${currentUser.isBlock()}" for="username" class="col-2">Add user</label>
            <select id="username" class="col form-control selectpicker" data-live-search="true" th:field="*{id}">
                <option value="">Search...</option>
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
            </select>
            <button class="col-1 btn btn-primary" type="submit">Add</button>
        </form>
    </div>
    <div>
        <table class="table table-striped table-sm">
            <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Block</th>
                <th>Option</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${chatUsers}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.role.name}"></td>
                <td th:text="${user.block}"></td>
                <td>
                    <a class="btn btn-outline-primary" th:href="@{'/chat/delete-user/' + ${chat.id} + '/' + ${user.id}}">Удалить из чата</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

<script>
    $("#username").change(function(){
        var item = $(this).val();
        var href = this.hash;

    });
</script>
</body>
</html>
