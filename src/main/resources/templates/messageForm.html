<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <title>Hello</title>
</head>
<body>
<span th:text="${error}"></span>
<div class="container" id="chat-page" th:object="${chat}">
    <div class="row">
        <div class="col align-self-start">
            <div class="border-bottom">
                <h4><label class="col-sm-7" id="chatName" th:text="${chat.name}"></label></h4>
                <a class="btn btn-link btn-sm" id="btn" th:href="@{'/chat/get-chat-users/' + ${chat.id}}">Показать всех участников</a>
            </div>
            <div class="puk">
                <dl th:each="message : ${messages}" class="dl-horizontal">
                    <dt th:text="${message.user.username}"></dt>
                    <dd th:text="${message.content}"></dd>
                </dl>
                <dl id="messageArea">
                </dl>
            </div>
        </div>
    </div>
    <form id="messageForm" class="row" th:object="${message}" >
        <textarea id="message" class="col-10" th:field="*{content}"></textarea>
        <button id="send" type="submit" class="col btn btn-primary">Send</button>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
